# SHOCKME · nginx  ·  Cloudflare Flexible
#
# Flexible means Cloudflare terminates TLS and talks to this box over plain
# HTTP on port 80. So: no certs here, no 443 block, no redirect-to-https
# (that would loop forever behind Flexible).
#
# Mail-in-a-Box OWNS nginx on this server. Do NOT drop this into
# sites-enabled — MiaB regenerates that directory and your file disappears
# on its next update. Use the custom hook:
#
#   /home/user-data/www/custom.yaml        (MiaB's own mechanism)
#   or  /etc/nginx/conf.d/local/shockme.conf   (MiaB includes conf.d/local)
#
# Replace __DOMAIN__ before installing.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    access_log /var/log/nginx/shockme.access.log;
    error_log  /var/log/nginx/shockme.error.log;

    # Cloudflare gives us the visitor's IP here. Without this every request
    # looks like it came from Cloudflare, which breaks rate limiting later.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # ---- the live room stream (SSE) ----
    # MUST come before the catch-all. Buffering is the killer here: with it
    # on, nginx holds the event stream and the rail never updates — the room
    # looks dead while the server is happily sending.
    location /bff/stream {
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        send_timeout 24h;
    }

    # ---- everything else ----
    location / {
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminated TLS, so tell the app the visitor is on https
        # even though this hop is plain http.
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    client_max_body_size 2m;
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 512;
}
